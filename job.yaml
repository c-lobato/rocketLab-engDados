resources:
  jobs:
    CineData_Analytics_Pipeline:
      name: CineData_Analytics_Pipeline
      schedule:
        quartz_cron_expression: 46 0 2 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/rocketLab-engDados/Landing_to_Bronze
            base_parameters:
              data_inicio: 09-14-2026
              data_fim: 09-21-2026
            source: WORKSPACE
          environment_key: to_Bronze_environment
        - task_key: to_Silver
          depends_on:
            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/rocketLab-engDados/Bronze_to_Silver
            source: WORKSPACE
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/rocketLab-engDados/Silver_to_Gold
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: to_Bronze_environment
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
